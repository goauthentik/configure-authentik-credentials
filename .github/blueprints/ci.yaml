# Trusts GitHub Actions OIDC tokens for the CI test application
version: 1
metadata:
  name: configure-authentik-credentials CI
entries:
  - model: authentik_sources_oauth.oauthsource
    id: github-actions
    identifiers:
      slug: github-actions
    attrs:
      name: GitHub Actions
      provider_type: openidconnect
      consumer_key: unused
      consumer_secret: unused
      oidc_well_known_url: https://token.actions.githubusercontent.com/.well-known/openid-configuration
  - model: authentik_providers_oauth2.oauth2provider
    id: provider
    identifiers:
      name: ci
    attrs:
      client_id: ci
      client_type: confidential
      authorization_flow:
        !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      jwt_federation_sources:
        - !KeyOf github-actions
      property_mappings:
        - !Find [
            authentik_providers_oauth2.scopemapping,
            [managed, goauthentik.io/providers/oauth2/scope-openid]
          ]
  - model: authentik_core.application
    identifiers:
      slug: ci
    attrs:
      name: ci
      provider: !KeyOf provider
